<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wisata Kudus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* BACKGROUND ANIMATED */
.bg{position:fixed;inset:0;z-index:0;}
.bg-circle{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.15;animation:float 6s ease-in-out infinite;}
.bg-circle:nth-child(1){width:500px;height:500px;background:#0d9488;top:-100px;left:-100px;animation-delay:0s;}
.bg-circle:nth-child(2){width:400px;height:400px;background:#4f46e5;bottom:-100px;right:-100px;animation-delay:2s;}
.bg-circle:nth-child(3){width:300px;height:300px;background:#0d9488;bottom:30%;left:20%;animation-delay:4s;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-30px);}}

/* CARD */
.card{position:relative;z-index:1;text-align:center;padding:48px 40px;max-width:380px;width:100%;}

/* LOGO */
.logo-wrap{margin-bottom:32px;}
.logo-icon{width:80px;height:80px;background:linear-gradient(135deg,#0d9488,#0f766e);border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 20px 40px rgba(13,148,136,0.4);animation:pulse-glow 2s ease-in-out infinite;}
@keyframes pulse-glow{0%,100%{box-shadow:0 20px 40px rgba(13,148,136,0.4);}50%{box-shadow:0 20px 60px rgba(13,148,136,0.7);}}
.logo-icon svg{width:40px;height:40px;fill:white;}
.title{color:white;font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.subtitle{color:rgba(255,255,255,0.5);font-size:0.9rem;}

/* LOADER */
.loader-wrap{margin:36px 0;}
.loader-bar{width:200px;height:3px;background:rgba(255,255,255,0.1);border-radius:50px;margin:0 auto 16px;overflow:hidden;}
.loader-fill{height:100%;background:linear-gradient(90deg,#0d9488,#4f46e5);border-radius:50px;animation:loading 2.5s ease-in-out forwards;}
@keyframes loading{0%{width:0%;}60%{width:80%;}90%{width:95%;}100%{width:100%;}}
.loader-text{color:rgba(255,255,255,0.4);font-size:0.8rem;letter-spacing:1px;text-transform:uppercase;animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:0.4;}50%{opacity:1;}}

/* DOTS */
.dots{display:flex;gap:8px;justify-content:center;margin-top:24px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);}
.dot:nth-child(1){animation:dot-pulse 1.4s ease-in-out infinite 0s;}
.dot:nth-child(2){animation:dot-pulse 1.4s ease-in-out infinite 0.2s;}
.dot:nth-child(3){animation:dot-pulse 1.4s ease-in-out infinite 0.4s;}
@keyframes dot-pulse{0%,80%,100%{background:rgba(255,255,255,0.2);transform:scale(1);}40%{background:#0d9488;transform:scale(1.3);}}

/* FOOTER */
.footer{position:fixed;bottom:24px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.2);font-size:0.75rem;z-index:1;}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
</div>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">
      <!-- Map Pin Icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>
    <div class="title">Wisata Kudus</div>
    <div class="subtitle">Portal Eksplorasi Destinasi Wisata</div>
  </div>

  <div class="loader-wrap">
    <div class="loader-bar">
      <div class="loader-fill" id="loader-fill"></div>
    </div>
    <div class="loader-text" id="loader-text">Memuat...</div>
  </div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<div class="footer">© 2024 Wisata Kudus</div>

<script>
const messages = [
  "Memuat...",
  "Menyiapkan koneksi...",
  "Mengecek sesi...",
  "Hampir selesai..."
];

let i = 0;
const textEl = document.getElementById("loader-text");

const interval = setInterval(() => {
  i++;
  if (i < messages.length) {
    textEl.textContent = messages[i];
  }
}, 600);

// Cek query param dari Android (role & nama)
const params = new URLSearchParams(window.location.search);
const role = params.get("role");
const nama = params.get("nama");

if (role && nama) {
  // Simpan sesi ke sessionStorage
  sessionStorage.setItem("wk_user", JSON.stringify({
    id: null,
    nama: decodeURIComponent(nama),
    role: role
  }));
}

// Redirect setelah animasi loading selesai (2.5 detik)
setTimeout(() => {
  clearInterval(interval);
  textEl.textContent = "Mengalihkan...";

  const savedSes = sessionStorage.getItem("wk_user");

  if (savedSes) {
    const user = JSON.parse(savedSes);
    if (user.role === "admin") {
      window.location.href = "/admin/";
    } else if (user.role === "mitra") {
      window.location.href = "/mitra/";
    } else {
      // guest atau tidak dikenal, tetap di loading (tidak redirect)
      textEl.textContent = "Akses tidak diizinkan";
    }
  } else {
    // Tidak ada sesi sama sekali
    textEl.textContent = "Silakan login melalui aplikasi";
  }
}, 2500);
</script>
</body>
</html>
